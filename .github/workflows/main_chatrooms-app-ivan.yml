# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy

name: 'Build and deploy Python app to Azure Web App: chatrooms-app-Ivan'

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python version
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'chatrooms-app-Ivan'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_463200de25d3404b85f64f5ad0477a49 }}
        package: '.'
