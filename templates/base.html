<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Anonymous Chat{% endblock %}</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #222;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 22px;
            margin: 0;
        }
        header .nickname {
            font-size: 14px;
            color: #555;
        }
        a {
            color: #1a5fb4;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }
        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #e9e9e9;
        }
        form.create-room, form.post-message {
            background: #fff;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        input[type=text] {
            width: 70%;
            padding: 8px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #1a5fb4;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #144a8c;
        }
        .messages {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px 15px;
            margin-top: 20px;
        }
        .message {
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }
        .message:last-child {
            border-bottom: none;
        }
        .message .meta {
            font-size: 12px;
            color: #777;
        }
        .message .author {
            font-weight: bold;
            color: #1a5fb4;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="{{ url_for('index') }}">Anonymous Chat</a></h1>
        <div class="nickname">You are: <strong>{{ nickname }}</strong></div>
    </header>
    {% block content %}{% endblock %}
</body>
</html>
